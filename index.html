<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#efe9e2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Group Station" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Group Station</title>
    <style>
      *{box-sizing:border-box}
      html{background:#ece5dd}
      html,body{margin:0;color:#111619;font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
      /* sfondo caldo sfumato con bagliore arancio (fisso anche su iPhone) */
      body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
        radial-gradient(38vmax 38vmax at 82% 22%,rgba(254,127,45,.42),rgba(254,127,45,0) 70%),
        radial-gradient(30vmax 30vmax at 8% 92%,rgba(254,150,80,.22),rgba(254,150,80,0) 70%),
        radial-gradient(45vmax 40vmax at 12% 8%,#fbf8f4,rgba(251,248,244,0) 70%),
        radial-gradient(40vmax 40vmax at 60% 70%,#f6f1ec,rgba(246,241,236,0) 70%),
        linear-gradient(160deg,#efe9e2 0%,#e6ddd3 55%,#ddd2c6 100%)}
      /* vetro: schede chiare e scure (colori C.card / C.dark / C.soft di src/ui.jsx) */
      [style*="rgba(255, 255, 255, 0.52)"]{-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);border:1px solid rgba(255,255,255,.75);box-shadow:0 10px 30px rgba(90,60,30,.07),inset 0 1px 0 rgba(255,255,255,.6)}
      [style*="rgba(28, 27, 27, 0.84)"]{-webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3);border:1px solid rgba(255,255,255,.12);box-shadow:0 14px 34px rgba(40,25,10,.18),inset 0 1px 0 rgba(255,255,255,.08)}
      input,select,textarea,button{font-family:inherit;font-size:14px}
      button{cursor:pointer}
      button:disabled{opacity:.5;cursor:default}
      a{color:inherit}
      ::selection{background:#8c0b0f;color:#fff}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
